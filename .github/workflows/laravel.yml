name: Laravel CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  # Job 1: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: parish_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, curl, dom, exif, fileinfo, gd, iconv, intl, libxml, mbstring, openssl, pdo, pdo_mysql, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Show PHP Environment
        run: |
          php -v
          php -m
          composer --version

      - name: Validate Composer Files
        run: composer validate --strict

      - name: Copy .env
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts -vvv

      - name: Run Package Discovery
        run: php artisan package:discover --ansi

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: parish_testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Execute Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: parish_testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

  # Job 2: Build Assets (Only on Push to Main)
  build:
    name: Build Production Assets
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -f "public/build/manifest.json" ]; then
            echo "Error: Build manifest not found"
            exit 1
          fi
          echo "Build verification successful"
          ls -lah public/build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: public/build/
          retention-days: 7

  # Job 3: Code Quality Checks
  code-quality:
    name: Code Quality (Pint)
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, curl, dom, fileinfo, iconv, libxml, mbstring, openssl, simplexml, tokenizer, xml, xmlreader, xmlwriter

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  # Job 4: Trigger Production Deployment
  deploy:
    name: Trigger Production Deployment
    runs-on: ubuntu-latest
    needs: [test, build, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    
    steps:
      - name: Check All Jobs Status
        run: |
          echo "==================================="
          echo "DEPLOYMENT STATUS SUMMARY"
          echo "==================================="
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "==================================="
          
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Tests or build failed - Skipping deployment"
            exit 1
          fi
          
          echo "✅ All checks passed - Triggering deployment webhook"
      
      - name: Trigger Deployment Webhook
        run: |
          # GitHub's push webhook will automatically trigger our webhook.php
          # This step just confirms deployment is ready
          echo "GitHub webhook will trigger deployment to production"
          echo "Monitor at: https://parish.quovadisyouthhub.org"
          echo "Webhook URL: https://parish.quovadisyouthhub.org/webhook.php"
