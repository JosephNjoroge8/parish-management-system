---
deployment:
  tasks:
    # Set deployment variables - UPDATE THESE PATHS FOR YOUR HOSTING
    # DEPLOYPATH should be your website's root directory (usually public_html or a subdirectory)
    # For main domain: /home2/yourusername/public_html
    # For subdomain: /home2/yourusername/public_html/subdomain
    # For addon domain: /home2/yourusername/public_html/yourdomain.com
    - export DEPLOYPATH=/home2/shemidig/parish_system
    - export PHPVER=82
    - export REPOPATH=$PWD
    
    # Create deployment directory if it doesn't exist
    - /bin/mkdir -p ${DEPLOYPATH}
    
    # Copy all files from repository to deployment directory
    - /bin/cp -rf ${REPOPATH}/. ${DEPLOYPATH}/
    
    # Create storage symlink for Laravel (if deploying to public_html subdirectory)
    - cd ${DEPLOYPATH} && /bin/ln -nfs ${DEPLOYPATH}/storage/app/public ${DEPLOYPATH}/public/storage 2>/dev/null || true
    
    # Install composer dependencies (production mode)
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    
    # Install npm dependencies and build production assets
    - cd ${DEPLOYPATH} && /usr/bin/npm ci --production=false --silent
    - cd ${DEPLOYPATH} && /usr/bin/npm run build
    
    # Set proper file permissions for Laravel
    - /bin/chmod -R 755 ${DEPLOYPATH}
    - /bin/chmod -R 775 ${DEPLOYPATH}/storage ${DEPLOYPATH}/bootstrap/cache
    - /bin/find ${DEPLOYPATH}/storage -type f -exec chmod 664 {} \;
    - /bin/find ${DEPLOYPATH}/bootstrap/cache -type f -exec chmod 664 {} \;
    
    # Create .env file if it doesn't exist (copy from .env.production if available)
    - cd ${DEPLOYPATH} && [ ! -f .env ] && [ -f .env.production ] && /bin/cp .env.production .env || true
    
    # Generate application key if needed
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan key:generate --no-interaction --force || true
    
    # Clear all Laravel caches
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan config:clear
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan cache:clear
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan route:clear
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan view:clear
    
    # Run database migrations
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan migrate --force --no-interaction
    
    # Build Laravel caches for production performance
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan config:cache
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan route:cache
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan view:cache
    
    # Optimize application for production
    - cd ${DEPLOYPATH} && /usr/local/bin/ea-php${PHPVER} artisan optimize
    
    # Create deployment log
    - cd ${DEPLOYPATH} && /bin/mkdir -p ${DEPLOYPATH}/storage/logs
    - cd ${DEPLOYPATH} && echo "[$(date '+%Y-%m-%d %H:%M:%S')] Auto-deployment completed successfully" >> ${DEPLOYPATH}/storage/logs/deployment.log