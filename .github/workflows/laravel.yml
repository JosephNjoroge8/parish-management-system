name: 🚀 Production Deployment Pipeline

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

jobs:
  # ============================================================================
  # STAGE 1: BUILD & TEST
  # ============================================================================
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: parish_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: parish_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Build Information
        run: |
          echo "🚀 ======================================"
          echo "   TEST BUILD STARTING"
          echo "======================================"
          echo "📅 Timestamp: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "💬 Message: $(git log -1 --pretty=%B)"
          echo "🐘 PHP Version: ${{ env.PHP_VERSION }}"
          echo "======================================"

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, curl, dom, exif, fileinfo, gd, iconv, intl, libxml, mbstring, openssl, pdo, pdo_mysql, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: 📦 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📋 Validate Composer files
        run: composer validate --strict

      - name: 🔧 Copy environment file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts

      - name: 🔑 Generate Application Key
        run: php artisan key:generate

      - name: 🔐 Set Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: 📊 Run Database Migrations
        run: php artisan migrate --force

      - name: ✅ Execute Test Suite
        run: php artisan test --parallel

  # ============================================================================
  # STAGE 2: BUILD FRONTEND ASSETS
  # ============================================================================
  build:
    name: 🏗️ Build Assets
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 💾 Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install NPM Dependencies
        run: |
          echo "Installing NPM dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ NPM dependencies installed"

      - name: 🏗️ Build Production Assets
        run: |
          echo "Building frontend assets..."
          npm run build
          echo "✅ Frontend assets built"

      - name: ✅ Verify Build Output
        run: |
          if [ ! -f "public/build/manifest.json" ]; then
            echo "❌ Error: Build manifest not found"
            exit 1
          fi
          echo "✅ Build verification successful"
          echo "📊 Build artifacts:"
          du -sh public/build/
          ls -lah public/build/ | head -10

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: public/build/
          retention-days: 7

  # ============================================================================
  # STAGE 3: CODE QUALITY CHECKS
  # ============================================================================
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, curl, dom, fileinfo, iconv, libxml, mbstring, openssl, simplexml, tokenizer, xml, xmlreader, xmlwriter

      - name: 📦 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-quality-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-quality-

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: 🎨 Run Laravel Pint
        run: vendor/bin/pint --test

  # ============================================================================
  # STAGE 4: PRODUCTION DEPLOYMENT
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    environment:
      name: production
    env:
      CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
      CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
      CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
      CPANEL_SERVER_DIR: ${{ secrets.CPANEL_SERVER_DIR }}
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
      CPANEL_SSH_PASSWORD: ${{ secrets.CPANEL_SSH_PASSWORD }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      PRODUCTION_WEBHOOK_URL: ${{ secrets.PRODUCTION_WEBHOOK_URL }}
      APP_URL: ${{ secrets.APP_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Verify Pipeline Status
        run: |
          echo "🎯 ======================================"
          echo "   DEPLOYMENT STATUS CHECK"
          echo "======================================"
          echo "✅ Tests: ${{ needs.test.result }}"
          echo "✅ Build: ${{ needs.build.result }}"
          echo "✅ Code Quality: ${{ needs.code-quality.result }}"
          echo "======================================"

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: ./artifacts

      - name: 🔄 Restore Build Artifacts
        run: |
          echo "📦 Restoring build artifacts..."
          if [ -d "./artifacts" ]; then
            mkdir -p public/build
            cp -r ./artifacts/* public/build/
            echo "✅ Assets restored"
          fi

      - name: 🌐 Attempt FTP Deployment (if configured)
        if: env.CPANEL_FTP_SERVER != '' && env.CPANEL_FTP_USERNAME != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ env.CPANEL_FTP_SERVER }}
          username: ${{ env.CPANEL_FTP_USERNAME }}
          password: ${{ env.CPANEL_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ env.CPANEL_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/storage/logs/**
            **/.env.example
            **/docker/**
            **/*.md

      - name: 🔧 Execute SSH Post-Deployment (if configured)
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_USERNAME != ''
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ env.CPANEL_SSH_HOST }}
          username: ${{ env.CPANEL_SSH_USERNAME }}
          password: ${{ env.CPANEL_SSH_PASSWORD }}
          port: ${{ env.CPANEL_SSH_PORT || '22' }}
          timeout: 120s
          script: |
            #!/bin/bash
            set -e
            echo "🔧 Starting post-deployment configuration..."
            cd "$CPANEL_SERVER_DIR" || { echo "❌ Directory not found"; exit 1; }

            echo "📍 Current directory: $(pwd)"
            echo "🐘 PHP version: $(php -v | head -n 1)"

            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || {
              echo "❌ Composer install failed"
              exit 1
            }

            echo "⏸️  Enabling maintenance mode..."
            php artisan down --render="errors::503" --retry=60 --refresh=10 2>/dev/null || true

            echo "🔐 Setting permissions..."
            chmod -R 755 storage bootstrap/cache 2>/dev/null || true

            echo "🧹 Clearing caches..."
            php artisan config:clear 2>/dev/null || true
            php artisan cache:clear 2>/dev/null || true
            php artisan route:clear 2>/dev/null || true
            php artisan view:clear 2>/dev/null || true

            echo "📊 Running migrations..."
            php artisan migrate --force || { echo "❌ Migration failed"; php artisan up; exit 1; }

            echo "⚡ Optimizing for production..."
            php artisan config:cache && echo "✓ Config cached"
            php artisan route:cache && echo "✓ Routes cached"
            php artisan view:cache && echo "✓ Views cached"

            echo "🔗 Linking storage..."
            php artisan storage:link 2>/dev/null && echo "✓ Storage linked" || echo "✓ Storage already linked"

            echo "🔄 Restarting queue..."
            php artisan queue:restart 2>/dev/null || true

            echo "✅ Bringing site online..."
            php artisan up

            echo "🎉 Post-deployment completed!"

      - name: "🌐 Fallback: Trigger Webhook Deployment"
        env:
          WEBHOOK_URL: ${{ env.PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️  No webhook configured. Deployment via SSH/FTP above."
            exit 0
          fi

          echo "🌐 Triggering webhook deployment..."
          curl --fail --show-error --connect-timeout 10 --max-time 30 \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            --data "{\"ref\":\"refs/heads/Main\",\"pusher\":{\"name\":\"github-actions\"},\"commits\":[{\"message\":\"CI Deployment\"}]}" || {
            echo "⚠️  Webhook trigger failed or timed out"
            exit 0
          }
          echo "✅ Webhook triggered successfully"

      - name: 💊 Health Check
        if: success()
        run: |
          echo "🏥 Performing health check..."

          if [ -n "$APP_URL" ]; then
            echo "🌐 Checking: $APP_URL"
            sleep 10

            HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" -L "$APP_URL" --connect-timeout 10 --max-time 30 || echo "000")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Health check passed! Status: $HTTP_CODE"
            else
              echo "⚠️  Unexpected status: $HTTP_CODE (check manually)"
            fi
          else
            echo "ℹ️  APP_URL secret not configured - skipping health check"
          fi

      - name: 🎉 Deployment Success Notification
        if: success()
        run: |
          echo "✅ =================================="
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "🚀 Application deployed to production"
          echo "📅 Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "======================================"

      - name: ❌ Deployment Failure Notification
        if: failure()
        run: |
          echo "❌ =================================="
          echo "⚠️  DEPLOYMENT FAILED!"
          echo "📋 Check logs above for details"
          echo "======================================"
          exit 1

      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo "### 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Status | **Successful** |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Date | $(date '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 By | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Commit | $(git log -1 --pretty=%B | head -1) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 SHA | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐘 PHP | ${{ env.PHP_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Node | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### ✅ Deployed Components" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend (Laravel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend Assets (Vite)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Database Migrations" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cache Optimization" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$APP_URL" ]; then
            echo "🌐 **Live URL:** [$APP_URL]($APP_URL)" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # STAGE 5: ROLLBACK (Manual Trigger Only)
  # ============================================================================
  rollback:
    name: 🔙 Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'workflow_dispatch'
    needs: deploy
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
      CPANEL_SSH_PASSWORD: ${{ secrets.CPANEL_SSH_PASSWORD }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SERVER_DIR: ${{ secrets.CPANEL_SERVER_DIR }}
      ROLLBACK_WEBHOOK_URL: ${{ secrets.ROLLBACK_WEBHOOK_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔙 Execute Rollback via SSH
        if: env.CPANEL_SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.CPANEL_SSH_HOST }}
          username: ${{ env.CPANEL_SSH_USERNAME }}
          password: ${{ env.CPANEL_SSH_PASSWORD }}
          port: ${{ env.CPANEL_SSH_PORT || '22' }}
          script: |
            echo "🔙 Rolling back to previous version..."
            cd "$CPANEL_SERVER_DIR"

            echo "📍 Current directory: $(pwd)"
            echo "🔄 Running rollback..."

            # Attempt Git rollback
            git reset --hard HEAD~1 && echo "✅ Git rolled back" || echo "⚠️  Git rollback not available"

            # Restore caches
            php artisan config:clear 2>/dev/null || true
            php artisan cache:clear 2>/dev/null || true
            php artisan route:clear 2>/dev/null || true

            # Restore schema
            composer install --no-dev --optimize-autoloader 2>/dev/null || true
            php artisan migrate:rollback 2>/dev/null || true

            # Bring site online
            php artisan up
            echo "✅ Rollback completed - site is live"

      - name: "🌐 Fallback: Manual Rollback via Webhook"
        if: env.ROLLBACK_WEBHOOK_URL != ''
        run: |
          echo "Triggering rollback webhook..."
          curl --fail -X POST "$ROLLBACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data '{"action":"rollback"}'
          echo "✅ Rollback webhook triggered"
