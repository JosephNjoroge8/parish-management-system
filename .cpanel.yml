---
# ============================================================================
# PRODUCTION-OPTIMIZED CPANEL DEPLOYMENT CONFIGURATION
# Parish Management System - Laravel 12 + Inertia.js + React
# ============================================================================

deployment:
  tasks:
    # ========================================================================
    # STEP 1: ENVIRONMENT SETUP
    # ========================================================================
    - export DEPLOYPATH=/home2/shemidig/parish_system/
    - export PHPVER=82  # Adjust to your PHP version (81, 82, 83, etc.)
    - echo "🚀 Starting production deployment to $DEPLOYPATH"
    - echo "PHP Version: $PHPVER"
    
    # ========================================================================
    # STEP 2: CLEAR CACHES
    # ========================================================================
    - rm -rf $DEPLOYPATH/storage/framework/cache/*
    - rm -rf $DEPLOYPATH/storage/framework/sessions/*
    - rm -rf $DEPLOYPATH/storage/framework/views/*
    - rm -rf $DEPLOYPATH/bootstrap/cache/*.php
    
    # ========================================================================
    # STEP 3: COMPOSER DEPENDENCIES (Production Optimized)
    # ========================================================================
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist 2>&1 || echo "⚠️ Composer install failed - check if composer is available"
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} /opt/cpanel/composer/bin/composer dump-autoload --optimize --classmap-authoritative 2>&1 || echo "⚠️ Composer dump-autoload failed"
    
    # ========================================================================
    # STEP 4: LARAVEL OPTIMIZATION
    # ========================================================================
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan optimize:clear
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan route:cache
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan view:cache
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan event:cache 2>/dev/null || echo "Event cache not available"
    
    # ========================================================================
    # STEP 5: DATABASE MIGRATIONS
    # ========================================================================
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan migrate --force --no-interaction 2>&1
    
    # ========================================================================
    # STEP 6: STORAGE SETUP
    # ========================================================================
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan storage:link 2>/dev/null || echo "Storage link already exists"
    
    # ========================================================================
    # STEP 7: PERMISSIONS
    # ========================================================================
    - chmod -R 755 $DEPLOYPATH/storage
    - chmod -R 755 $DEPLOYPATH/bootstrap/cache
    - chmod 600 $DEPLOYPATH/.env 2>/dev/null || echo ".env permissions set"
    
    # ========================================================================
    # STEP 8: FINAL OPTIMIZATION
    # ========================================================================
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan optimize
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan queue:restart 2>/dev/null || echo "No queue workers"
    
    # ========================================================================
    # STEP 9: DEPLOYMENT SUMMARY
    # ========================================================================
    - echo "✅ Deployment completed successfully!"
    - echo "🔗 Site: http://parish.quovadisyouthhub.org"
    - cd $DEPLOYPATH && /usr/local/bin/ea-php${PHPVER} artisan --version