name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  # Job 1: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: parish_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, bcmath, gd, exif, intl
          coverage: none

      - name: Copy .env
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: parish_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Execute Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: parish_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

  # Job 2: Build Assets (Only on Push to Main)
  build:
    name: Build Production Assets
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -f "public/build/manifest.json" ]; then
            echo "Error: Build manifest not found"
            exit 1
          fi
          echo "Build verification successful"
          ls -lah public/build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: public/build/
          retention-days: 7

  # Job 3: Code Quality Checks
  code-quality:
    name: Code Quality (Pint)
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  # Job 4: Notify Deployment Status
  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [test, build, code-quality]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/Main'
    
    steps:
      - name: Deployment Status Summary
        run: |
          echo "==================================="
          echo "DEPLOYMENT STATUS SUMMARY"
          echo "==================================="
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "==================================="
          
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ All checks passed - Webhook will trigger deployment"
            exit 0
          else
            echo "❌ Some checks failed - Deployment may be skipped"
            exit 1
          fi
